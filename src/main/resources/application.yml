server:
  port: 8080

spring:
  application:
    name: messagerie
  datasource:
    url: jdbc:mysql://localhost:3306/messagerie_app?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: messagerie_user
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
app:
  jwt:
    # au moins 32 caractères, fourni par la variable d'environnement JWT_SECRET
    secret: ${JWT_SECRET}
    expiration-minutes: 60